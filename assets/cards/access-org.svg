<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 132" width="590" height="132"><style>:root{--t:#1f2328;--m:#656d76;--a:#7C3AED;--l:#d0d7de}@media (prefers-color-scheme:dark){:root{--t:#e6edf3;--m:#8b949e;--a:#A78BFA;--l:#30363d}}text{font-family:'Segoe UI',-apple-system,Helvetica,Arial,sans-serif}.mono{font-family:Consolas,Menlo,'DejaVu Sans Mono',monospace}.t{fill:var(--t)}.m{fill:var(--m)}.rise{opacity:0;animation:rise .8s cubic-bezier(.16,1,.3,1) forwards}@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.slide{animation:slide 6s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(0)}to{transform:translateX(1096px)}}.s{animation:lit 7.199999999999999s infinite}@keyframes lit{0%,8.3%{fill:var(--a)}16.7%,100%{fill:var(--m)}}@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}</style><g class="rise" style="animation-delay:0.12s"><rect x=".5" y=".5" width="589" height="131" rx="12" fill="none" stroke="var(--l)"/><clipPath id="r"><rect x="24" y="26" width="80" height="80" rx="16"/></clipPath><image clip-path="url(#r)" x="24" y="26" width="80" height="80" href="data:image/svg+xml;base64,"/><text class="t" x="116" y="50" font-size="22" font-weight="600">Access Community</text><text class="mono" x="562" y="48" font-size="13" text-anchor="end" fill="var(--a)">Core developer</text><text class="m" x="116" y="76" font-size="15">The community behind Hexagone. Core developer</text><text class="m" x="116" y="98" font-size="15">since May 2023.</text></g></svg>