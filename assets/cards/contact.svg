<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 96" width="1200" height="96"><style>:root{--t:#1f2328;--m:#656d76;--a:#7C3AED;--l:#d0d7de}@media (prefers-color-scheme:dark){:root{--t:#e6edf3;--m:#8b949e;--a:#A78BFA;--l:#30363d}}text{font-family:'Segoe UI',-apple-system,Helvetica,Arial,sans-serif}.mono{font-family:Consolas,Menlo,'DejaVu Sans Mono',monospace}.t{fill:var(--t)}.m{fill:var(--m)}.rise{opacity:0;animation:rise .8s cubic-bezier(.16,1,.3,1) forwards}@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.slide{animation:slide 6s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(0)}to{transform:translateX(1096px)}}.s{animation:lit 7.199999999999999s infinite}@keyframes lit{0%,8.3%{fill:var(--a)}16.7%,100%{fill:var(--m)}}@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}</style><g class="rise"><rect x=".5" y=".5" width="1199" height="95" rx="12" fill="none" stroke="var(--l)"/><rect x="0" y="34" width="3" height="28" rx="1.5" fill="var(--a)"/><text class="mono m" x="32" y="40" font-size="13">Email</text><text class="t" x="32" y="70" font-size="26" font-weight="600">lilnesquuikpro@gmail.com</text><text class="mono" x="1168" y="58" font-size="15" text-anchor="end" fill="var(--a)">Send a message -&gt;</text></g></svg>