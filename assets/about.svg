<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="1200" height="140"><style>:root{--t:#1f2328;--m:#656d76;--a:#7C3AED;--l:#d0d7de}@media (prefers-color-scheme:dark){:root{--t:#e6edf3;--m:#8b949e;--a:#A78BFA;--l:#30363d}}text{font-family:'Segoe UI',-apple-system,Helvetica,Arial,sans-serif}.mono{font-family:Consolas,Menlo,'DejaVu Sans Mono',monospace}.t{fill:var(--t)}.m{fill:var(--m)}.rise{opacity:0;animation:rise .8s cubic-bezier(.16,1,.3,1) forwards}@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.slide{animation:slide 6s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(0)}to{transform:translateX(1096px)}}.s{animation:lit 7.199999999999999s infinite}@keyframes lit{0%,8.3%{fill:var(--a)}16.7%,100%{fill:var(--m)}}@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}</style><text class="rise t" x="8" y="66" font-size="28" font-weight="600">Game servers, APIs and web bridges</text><text class="rise m" x="8" y="98" font-size="18" style="animation-delay:.15s">Backend work in C# and Ruby, from plugins to dashboards.</text><g class="rise" style="animation-delay:0.30s"><line x1="636" y1="30" x2="636" y2="110" stroke="var(--l)"/><text class="t" x="660" y="76" font-size="46" font-weight="700" letter-spacing="-1">413</text><text class="mono m" x="660" y="102" font-size="13">commits since 2023</text></g><g class="rise" style="animation-delay:0.45s"><line x1="816" y1="30" x2="816" y2="110" stroke="var(--l)"/><text class="t" x="840" y="76" font-size="46" font-weight="700" letter-spacing="-1">15+</text><text class="mono m" x="840" y="102" font-size="13">repositories</text></g><g class="rise" style="animation-delay:0.60s"><line x1="996" y1="30" x2="996" y2="110" stroke="var(--l)"/><text class="t" x="1020" y="76" font-size="46" font-weight="700" letter-spacing="-1">3+</text><text class="mono m" x="1020" y="102" font-size="13">years on live servers</text></g></svg>