<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 158" width="1200" height="158"><style>:root{--t:#1f2328;--m:#656d76;--a:#7C3AED;--l:#d0d7de}@media (prefers-color-scheme:dark){:root{--t:#e6edf3;--m:#8b949e;--a:#A78BFA;--l:#30363d}}text{font-family:'Segoe UI',-apple-system,Helvetica,Arial,sans-serif}.mono{font-family:Consolas,Menlo,'DejaVu Sans Mono',monospace}.t{fill:var(--t)}.m{fill:var(--m)}.rise{opacity:0;animation:rise .8s cubic-bezier(.16,1,.3,1) forwards}@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.slide{animation:slide 6s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(0)}to{transform:translateX(1096px)}}.s{animation:lit 7.199999999999999s infinite}@keyframes lit{0%,8.3%{fill:var(--a)}16.7%,100%{fill:var(--m)}}@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}</style><text class="rise t" x="6" y="64" font-size="60" font-weight="700" letter-spacing="-2">Morgan</text><text class="rise m" x="228" y="64" font-size="24" style="animation-delay:.2s">Backend developer, .NET and Rails</text><text class="mono m s" x="8" y="112" font-size="19" style="animation-delay:0.0s">C#</text><text class="mono m s" x="58" y="112" font-size="19" style="animation-delay:0.6s">.NET</text><text class="mono m s" x="130" y="112" font-size="19" style="animation-delay:1.2s">Ruby</text><text class="mono m s" x="202" y="112" font-size="19" style="animation-delay:1.8s">Rails</text><text class="mono m s" x="285" y="112" font-size="19" style="animation-delay:2.4s">Go</text><text class="mono m s" x="335" y="112" font-size="19" style="animation-delay:3.0s">TypeScript</text><text class="mono m s" x="473" y="112" font-size="19" style="animation-delay:3.6s">Unity</text><text class="mono m s" x="556" y="112" font-size="19" style="animation-delay:4.2s">GraphQL</text><text class="mono m s" x="661" y="112" font-size="19" style="animation-delay:4.8s">Docker</text><text class="mono m s" x="755" y="112" font-size="19" style="animation-delay:5.4s">PostgreSQL</text><text class="mono m s" x="893" y="112" font-size="19" style="animation-delay:6.0s">Redis</text><text class="mono m s" x="976" y="112" font-size="19" style="animation-delay:6.6s">RabbitMQ</text><line x1="8" y1="142" x2="1192" y2="142" stroke="var(--l)"/><rect class="slide" x="8" y="141" width="96" height="2" rx="1" fill="var(--a)"/></svg>